<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STILLWELL — Building Tour</title>
<style>
  :root{
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --ink:#1d262c; --muted:#5f6b73; --card:rgba(255,255,255,.9); --line:rgba(29,38,44,.12);
    --accent:#2f6f8f; --btn:#ffffff; --btnInk:#1d262c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
  body{background:#dfe7ea}
  .sky{position:fixed;inset:0;transition:opacity 1.2s ease}
  #skyDay{background:linear-gradient(180deg,#eef3f5 0%,#d7e2e6 60%,#cbd8dc 100%)}
  #skyNight{background:radial-gradient(1200px 600px at 70% -10%,#2a3866 0%,#121a33 45%,#090d1b 100%);opacity:0}
  body.night #skyNight{opacity:1}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #stage canvas.dragging{cursor:grabbing}
  #stage canvas.hover{cursor:pointer}

  header.top{position:fixed;top:20px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
  header.top > *{pointer-events:auto}
  .brand .logo{font-weight:800;letter-spacing:.32em;font-size:22px}
  .brand .sub{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
  body.night .brand .logo{color:#f3f1ea}
  body.night .brand .sub{color:#a9b3c7}

  .dn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 14px 6px 6px;font:600 14px var(--font);color:var(--ink);cursor:pointer;box-shadow:0 6px 20px rgba(20,30,40,.08)}
  .dn .track{width:44px;height:26px;border-radius:999px;background:#f2c46b;position:relative;transition:background .4s}
  .dn .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .4s;display:grid;place-items:center;font-size:12px}
  body.night .dn{background:rgba(22,30,52,.88);color:#eef0f6;border-color:rgba(255,255,255,.12)}
  body.night .dn .track{background:#3f4f86}
  body.night .dn .knob{transform:translateX(18px)}

  .hint{position:fixed;top:28px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;z-index:4;white-space:nowrap;pointer-events:none}
  body.night .hint{background:rgba(22,30,52,.8);color:#b9c2d6;border-color:rgba(255,255,255,.1)}

  #floors{position:fixed;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
  #floors button{display:flex;align-items:center;gap:10px;min-width:148px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);border-radius:12px;padding:9px 12px;font:500 13px var(--font);cursor:pointer;text-align:left;transition:background .2s,color .2s,transform .2s,border-color .2s}
  #floors button b{font-weight:700;font-size:14px;min-width:24px}
  #floors button:hover{transform:translateX(-3px)}
  #floors button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  #floors button.all{justify-content:center;margin-top:6px;font-weight:600}
  body.night #floors button{background:rgba(22,30,52,.85);color:#e8ebf3;border-color:rgba(255,255,255,.1)}
  body.night #floors button.active{background:#f3d08a;color:#1a2033;border-color:#f3d08a}

  #panel{position:fixed;left:24px;bottom:24px;width:340px;max-height:calc(100vh - 120px);overflow:auto;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px;z-index:5;box-shadow:0 14px 40px rgba(20,30,40,.12)}
  #panel .inner{transition:opacity .25s ease, transform .25s ease}
  #panel .inner.swap{opacity:0;transform:translateY(6px)}
  #panel .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
  #panel .tag i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
  #panel h2{margin:8px 0 6px;font-size:24px;font-weight:700;letter-spacing:-.01em}
  #panel p{margin:0 0 12px;font-size:14px;line-height:1.6;color:var(--muted)}
  #panel ul{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
  #panel li{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:8px 10px;border-radius:10px;background:rgba(29,38,44,.05)}
  #panel li span.n{font-size:11px;font-weight:700;color:var(--accent);min-width:18px}
  #panel .other{border-top:1px solid var(--line);padding-top:12px}
  #panel .other .lbl{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:8px}
  #pChips{display:flex;flex-wrap:wrap;gap:6px}
  #pChips button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:5px 10px;font:600 12px var(--font);cursor:pointer}
  #pChips button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .actions{display:flex;gap:6px;margin-top:12px}
  .actions button{flex:1;border:1px solid var(--line);background:var(--btn);color:var(--btnInk);border-radius:10px;padding:9px 8px;font:600 13px var(--font);cursor:pointer}
  .actions button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .actions button:disabled{opacity:.35;cursor:default}
  .actions button[hidden]{display:none}
  body.night #panel{background:rgba(20,27,48,.9);color:#eef0f6;border-color:rgba(255,255,255,.1)}
  body.night #panel p{color:#aab4c8}
  body.night #panel li{background:rgba(255,255,255,.06)}
  body.night #panel .other{border-color:rgba(255,255,255,.1)}
  body.night #panel .other .lbl{color:#aab4c8}
  body.night #pChips button{border-color:rgba(255,255,255,.16)}
  body.night #pChips button.active{background:#f3d08a;color:#1a2033;border-color:#f3d08a}
  body.night .actions button{background:rgba(255,255,255,.06);color:#eef0f6;border-color:rgba(255,255,255,.14)}
  body.night .actions button.primary{background:#f3d08a;color:#1a2033;border-color:#f3d08a}

  #tip{position:fixed;pointer-events:none;z-index:6;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;opacity:0;transform:translate(12px,12px);transition:opacity .15s;white-space:nowrap}
  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:20;background:#eef2f4;font-size:15px;color:#333}

  @media (max-width: 820px){
    header.top{top:12px;left:14px;right:14px}
    .brand .logo{font-size:18px}
    .brand .sub{font-size:11px}
    .hint{display:none}
    #floors{top:62px;left:10px;right:10px;transform:none;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px;scrollbar-width:none}
    #floors::-webkit-scrollbar{display:none}
    #floors button{min-width:0;flex:0 0 auto;flex-direction:column;gap:0;padding:6px 10px;text-align:center;border-radius:10px}
    #floors button span{font-size:10.5px;opacity:.8}
    #floors button:hover{transform:none}
    #floors button.all{margin-top:0;justify-content:center}
    #panel{left:10px;right:10px;bottom:10px;width:auto;max-height:42vh;padding:14px 14px 12px;border-radius:16px}
    #panel h2{font-size:19px;margin:4px 0}
    #panel p{font-size:13px;margin-bottom:8px;line-height:1.5}
    #panel ul{grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
    #panel li{font-size:11.5px;padding:6px 7px;flex-direction:column;align-items:flex-start;gap:2px}
    #panel .other{padding-top:8px}
    #panel .other .lbl{margin-bottom:6px}
    #pChips button{padding:4px 8px;font-size:11.5px}
    .actions{margin-top:8px}
    .actions button{padding:8px 6px;font-size:12.5px}
  }
  @media (min-width: 821px) and (max-height: 600px){
    #floors button{padding:5px 10px}
    #panel{max-height:calc(100vh - 90px)}
  }
</style>

<body>
<div class="sky" id="skyDay"></div>
<div class="sky" id="skyNight"></div>
<div id="stage"></div>

<header class="top" id="header">
  <div class="brand">
    <div class="logo">STILLWELL</div>
    <div class="sub">5 Floors + Rooftop · Building Tour</div>
  </div>
  <button class="dn" id="dn" aria-pressed="false" title="낮/밤 전환 (N)">
    <span class="track"><span class="knob" id="knob">☀</span></span>
    <span id="dnLabel">낮</span>
  </button>
</header>

<div class="hint">드래그: 좌우 회전 · 휠: 확대 · 건물 층 클릭: 층 선택</div>

<nav id="floors" aria-label="층 선택"></nav>

<aside id="panel" aria-live="polite">
  <div class="inner" id="pInner">
    <div class="tag" id="pTag"><i></i><span>OVERVIEW</span></div>
    <h2 id="pTitle">STILLWELL</h2>
    <p id="pDesc"></p>
    <ul id="pFeat"></ul>
    <div class="other">
      <span class="lbl">다른 층 보기</span>
      <div id="pChips"></div>
    </div>
    <div class="actions">
      <button id="btnPrev">↓ 아래층</button>
      <button id="btnNext" class="primary">위층 ↑</button>
      <button id="btnAll">전체 보기</button>
    </div>
  </div>
</aside>

<div id="tip"></div>
<div id="err">3D 장면을 불러오지 못했습니다.<br>인터넷 연결(Three.js CDN)과 WebGL 지원 여부를 확인해 주세요.</div>

<script>
  // CDN 로드 실패 시 안내
  setTimeout(function(){ if(!window.__stillwellReady){ document.getElementById('err').style.display='grid'; } }, 8000);
</script>

<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------ */
/*  데이터                                                              */
/* ------------------------------------------------------------------ */
const FLOORS = [
  { id:'1F', name:'로비', en:'Lobby', color:'#2f6f8f',
    desc:'STILLWELL의 첫인상. 높은 층고와 전면 유리 입구로 자연광이 깊숙이 들어오는 로비에서 방문객을 맞이합니다.',
    feats:['리셉션 데스크 상시 운영','전면 유리 출입구','대기 라운지와 실내 정원'] },
  { id:'2F', name:'사무 공간', en:'Workspace', color:'#4a6fa5',
    desc:'집중을 위한 오픈 오피스. 좌석 사이를 넉넉히 띄우고, 조용한 포커스 부스를 함께 두었습니다.',
    feats:['오픈 데스크 20석','1인 포커스 부스','화이트보드 협업 존'] },
  { id:'3F', name:'회의·라운지', en:'Meeting & Lounge', color:'#7a5c9e',
    desc:'유리 회의실과 편안한 라운지가 한 층에. 공식 회의부터 가벼운 대화까지 이곳에서 이루어집니다.',
    feats:['8인 유리 회의실','화상회의 스크린','소파 라운지'] },
  { id:'4F', name:'카페·테라스', en:'Café & Terrace', color:'#b0703c',
    desc:'직접 내린 커피와 바깥 공기. 실내 카페에서 이어지는 테라스에서 잠시 쉬어 가세요.',
    feats:['스페셜티 커피 바','야외 테라스 좌석','08:00 – 21:00 운영'] },
  { id:'5F', name:'피트니스', en:'Fitness', color:'#3f8a68',
    desc:'업무 전후로 몸을 깨우는 공간. 유산소·근력 기구와 스트레칭 존을 고루 갖췄습니다.',
    feats:['러닝머신·실내 자전거','프리웨이트·케이블 존','요가·스트레칭 매트'] },
  { id:'RF', name:'루프테라스', en:'Roof Terrace', color:'#b04f5a',
    desc:'건물 꼭대기의 열린 정원. 도시 풍경을 바라보며 저녁 모임과 휴식을 즐길 수 있습니다.',
    feats:['퍼골라 라운지','옥상 정원','저녁 스트링 조명'] },
];
const OVERVIEW = {
  tag:'Overview', name:'STILLWELL', color:'#2f6f8f',
  desc:'다섯 개 층과 루프탑으로 이루어진 작은 건물. 오른쪽 층 버튼이나 건물의 층을 직접 눌러 안을 둘러보세요.',
  feats:['총 5개 층 + 루프탑','드래그로 좌우 회전','낮 / 밤 조명 전환'],
};

/* ------------------------------------------------------------------ */
/*  기본 설정                                                           */
/* ------------------------------------------------------------------ */
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
const W = 16, D = 10, FH = 3.4, SLAB = 0.3, WALL = 0.25;
const hw = W/2, hd = D/2, IH = FH - SLAB, FT = SLAB + 0.02;
const PI = Math.PI;

let seed = 20261126;
function rand(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const pick = a => a[Math.floor(rand()*a.length)];

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 400);

const hemi = new THREE.HemisphereLight(0xffffff, 0xa7b493, 1.25);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6);
sun.position.set(-16, 34, 26);
sun.target.position.set(0, 6, 0);
scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-36, right:36, top:36, bottom:-36, near:1, far:120 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun);

/* ------------------------------------------------------------------ */
/*  헬퍼                                                                */
/* ------------------------------------------------------------------ */
let MC = new Map();
function mat(color, opts){
  if (opts) return new THREE.MeshStandardMaterial(Object.assign({ color, roughness:.8, metalness:0 }, opts));
  if (!MC.has(color)) MC.set(color, new THREE.MeshStandardMaterial({ color, roughness:.8, metalness:0 }));
  return MC.get(color);
}
const M = m => (typeof m === 'string' ? mat(m) : m);
function mesh(p, geo, m, x, y, z){
  const me = new THREE.Mesh(geo, M(m));
  me.position.set(x, y, z); me.castShadow = true; me.receiveShadow = true; p.add(me); return me;
}
const box = (p,w,h,d,m,x=0,y=0,z=0,ry=0) => { const me = mesh(p,new THREE.BoxGeometry(w,h,d),m,x,y,z); me.rotation.y = ry; return me; };
const cyl = (p,rt,rb,h,m,x=0,y=0,z=0,seg=16) => mesh(p,new THREE.CylinderGeometry(rt,rb,h,seg),m,x,y,z);
const sph = (p,r,m,x=0,y=0,z=0,seg=14) => mesh(p,new THREE.SphereGeometry(r,seg,Math.max(6,seg*0.7|0)),m,x,y,z);
const ico = (p,r,m,x,y,z,det=1) => mesh(p,new THREE.IcosahedronGeometry(r,det),m,x,y,z);
function grp(p,x=0,y=0,z=0,ry=0){ const g = new THREE.Group(); g.position.set(x,y,z); g.rotation.y = ry; p.add(g); return g; }

// 밤 조명 등록: d=낮 세기, n=밤 세기
const nightMats = [];
function glow(color, emissive, d, n, opts={}){
  const m = new THREE.MeshStandardMaterial(Object.assign({ color, emissive, emissiveIntensity:d, roughness:.5 }, opts));
  nightMats.push({ m, d, n }); return m;
}
const winMat = () => glow('#a7bfcc', '#ffcf8a', 0, rand() < .18 ? .12 : 0.9 + rand()*0.9, { roughness:.12, metalness:.35 });
const glassMat = (op=.22) => new THREE.MeshStandardMaterial({ color:'#bcd8e3', transparent:true, opacity:op, roughness:.05, metalness:.1, depthWrite:false });

function textTexture(lines, o={}){
  const w = o.w || 1024, h = o.h || 256;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = o.bg || '#1f2a30'; x.fillRect(0, 0, w, h);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  lines.forEach((L, i) => {
    x.font = `${L.weight || 700} ${L.size || 120}px ${FONT}`;
    if ('letterSpacing' in x) x.letterSpacing = (L.ls || 0) + 'px';
    x.fillStyle = L.color || o.fg || '#fff';
    x.fillText(L.t, w/2 + (L.ls||0)/2, L.y != null ? L.y*h : h*(i + .5)/lines.length);
  });
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function textMat(tex, d=.08, n=1.1){
  const m = new THREE.MeshStandardMaterial({ map:tex, emissive:'#ffffff', emissiveMap:tex, emissiveIntensity:d, roughness:.6 });
  nightMats.push({ m, d, n }); return m;
}
function plane(p,w,h,m,x,y,z,ry=0){ const me = new THREE.Mesh(new THREE.PlaneGeometry(w,h), m); me.position.set(x,y,z); me.rotation.y = ry; p.add(me); return me; }

/* ---- 사람 ---- */
const SKIN = ['#f1c9a8','#d9a27c','#a8714f','#f6d7bd','#c48a63'];
const HAIR = ['#2a211c','#4a3426','#1b1b1f','#7a5a3a','#c9a46a','#3b3b42'];
const PANTS = ['#2d3440','#3f4a5a','#55483d','#26292e','#6b7280'];
const SHIRTS = ['#e07a5f','#3d5a80','#81b29a','#f2cc8f','#98c1d9','#9c6644','#e5e5e5','#6d597a','#ee6c4d','#4f772d','#b56576','#457b9d'];
const CAPS = new THREE.CapsuleGeometry(.2, .38, 4, 10);
const ARM = new THREE.CapsuleGeometry(.065, .42, 3, 6);
const HAIRG = new THREE.SphereGeometry(.172, 12, 8, 0, PI*2, 0, PI*.55);
function person(p, x, z, o={}){
  const g = grp(p, x, o.y || 0, z, o.ry || 0);
  g.scale.setScalar(.88);
  const shirt = o.shirt || pick(SHIRTS), pants = o.pants || pick(PANTS);
  let top;
  if (o.seated){
    box(g,.36,.16,.52,pants,0,.58,.14);
    box(g,.34,.52,.16,pants,0,.26,.38);
    top = .66;
  } else {
    box(g,.15,.84,.2,pants,-.09,.42,0);
    box(g,.15,.84,.2,pants,.09,.42,0);
    top = .84;
  }
  mesh(g, CAPS, shirt, 0, top + .39, 0);
  const a1 = mesh(g, ARM, shirt, -.26, top + .42, o.seated ? .08 : 0);
  const a2 = mesh(g, ARM, shirt,  .26, top + .42, o.seated ? .08 : 0);
  if (o.seated){ a1.rotation.x = -.5; a2.rotation.x = -.5; }
  if (o.wave){ a2.rotation.z = 2.4; a2.position.y += .3; }
  sph(g, .165, o.skin || pick(SKIN), 0, top + .95, 0, 14);
  mesh(g, HAIRG, o.hair || pick(HAIR), 0, top + .97, -.01);
  return g;
}

/* ---- 가구 ---- */
function chair(p,x,z,ry,color='#3c4a55'){
  const c = grp(p,x,0,z,ry);
  box(c,.5,.08,.5,color,0,.46,0);
  box(c,.5,.52,.07,color,0,.77,-.22);
  cyl(c,.03,.03,.42,'#5b636b',0,.23,0,8);

const building = new THREE.Group();

const floorObjs = [];

function shell(i, o){
  MC = new Map(); // 층별 재질 분리(투명도 개별 제어용)
  const g = grp(building, 0, i*FH, 0);
  box(g, W, SLAB, D, o.slab || '#ebe7e0', 0, SLAB/2, 0);
  box(g, W-WALL*2-.02, .02, D-WALL-.1, o.floor, 0, SLAB+.01, WALL/2-.05);
  if (!o.noWalls){
    const wm = mat(o.wall || '#f4f1ec');
    box(g, W, IH, WALL, wm, 0, SLAB+IH/2, -hd+WALL/2);
    box(g, WALL, IH, D-WALL, wm, -hw+WALL/2, SLAB+IH/2, WALL/2);
    box(g, WALL, IH, D-WALL, wm,  hw-WALL/2, SLAB+IH/2, WALL/2);
    const wh = IH*.58, wy = SLAB + IH*.52;
    for (let k=0;k<5;k++){
      if (o.skipBack && o.skipBack.includes(k)) continue;
      box(g, 2.3, wh, WALL+.08, winMat(), -6.4 + k*3.2, wy, -hd+WALL/2);
    }
    for (const sx of [-1,1]) for (let k=0;k<3;k++)
      box(g, WALL+.08, wh, 2.0, winMat(), sx*(hw-WALL/2), wy, -3 + k*3);
    for (const sx of [-1,1]) box(g, .45, IH, .45, o.col || '#d8d2c8', sx*(hw-.225), SLAB+IH/2, hd-.225);
    const lamp = glow('#ffffff', '#fff1d2', .15, 2.2);
    for (const x of [-4.5, 0, 4.5]) box(g, 2.6, .05, .32, lamp, x, FH-.03, .6);
  }
  const L = new THREE.PointLight(0xffd9a6, 0, 15, 1.6);
  L.position.set(0, o.noWalls ? 3 : FH-.8, .8);
  g.add(L);
  const f = grp(g, 0, FT, 0);
  const obj = { g, f, light:L, lightMax: o.noWalls ? 14 : 22, op:1, opT:1, lift:0, liftT:0, mats:[], meshes:[] };
  floorObjs.push(obj);
  return obj;
}

    prev.textContent = selected === 0 ? '↓ 아래층' : `↓ ${FLOORS[selected-1].id}`;

}

function selectFloor(i){
  if (i === selected) { if (i == null) return; }
  selected = i;
  floorObjs.forEach((o, k) => {
    if (i == null){ o.opT = 1; o.liftT = 0; }
    else if (k === i){ o.opT = 1; o.liftT = 0; }
    else if (k > i){ o.opT = .1; o.liftT = 7.5; }
    else { o.opT = .22; o.liftT = 0; }
    const shadow = o.opT > .5;
    o.meshes.forEach(m => m.castShadow = shadow && m.userData.cast);
  });
  const inner = $('pInner');
  inner.classList.add('swap');
  setTimeout(() => { renderPanel(); inner.classList.remove('swap'); }, 160);
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp'){ selectFloor(selected == null ? 0 : Math.min(5, selected + 1)); e.preventDefault(); }
  else if (e.key === 'ArrowDown'){ if (selected != null) selectFloor(selected === 0 ? null : selected - 1); e.preventDefault(); }
  else if (e.key === 'Escape') selectFloor(null);
  else if (e.key === 'n' || e.key === 'N') setNight(!night);
});

const canvas = renderer.domElement;

let drag = null, hoverQueued = null;
function pickFloor(cx, cy){
  const rc = canvas.getBoundingClientRect();
  ndc.set(((cx - rc.left)/rc.width)*2 - 1, -((cy - rc.top)/rc.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  for (const h of hits){
    const k = h.object.userData.floor;
    // 흐려진 층은 통과하여 뒤의 층 우선 (단, 클릭 시 선택은 가능)
    if (selected != null && floorObjs[k].op < .5 && hits.some(o => floorObjs[o.object.userData.floor].op > .5)) continue;
    return k;
  }
  return null;
}
canvas.addEventListener('pointerdown', e => {
  drag = { x:e.clientX, y:e.clientY, lx:e.clientX, moved:0, id:e.pointerId, t:performance.now() };
  canvas.setPointerCapture(e.pointerId);
  azVel = 0;
});
canvas.addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.id){
    const dx = e.clientX - drag.lx; drag.lx = e.clientX;
    drag.moved += Math.abs(dx) + Math.abs(e.movementY || 0);
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5){ canvas.classList.add('dragging'); tip.style.opacity = 0; }
    azT -= dx * 0.0075; azVel = -dx * 0.0075;
  } else if (e.pointerType === 'mouse'){
    hoverQueued = { x:e.clientX, y:e.clientY };
  }
});
function endDrag(e){
  if (!drag) return;
  const tap = Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6;
  canvas.classList.remove('dragging');
  if (tap && e.type === 'pointerup'){
    const k = pickFloor(e.clientX, e.clientY);
    if (k != null && k !== selected) selectFloor(k);
    azVel = 0;
  }
  drag = null;
}
canvas.addEventListener('pointerup', endDrag);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomMul = THREE.MathUtils.clamp(zoomMul * Math.exp(-e.deltaY * 0.0012), .6, 2.2);
}, { passive:false });

function doHover(){
  if (!hoverQueued || drag) return;
  const { x, y } = hoverQueued; hoverQueued = null;
  const k = pickFloor(x, y);
  if (k == null){ tip.style.opacity = 0; canvas.classList.remove('hover'); return; }
  canvas.classList.add('hover');
  tip.textContent = `${FLOORS[k].id} ${FLOORS[k].name}` + (k === selected ? '' : ' · 클릭해서 보기');
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.style.opacity = 1;
}

const tmpR = new THREE.Vector3(), tmpU = new THREE.Vector3(), dir = new THREE.Vector3();
let first = true;

function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  const k = 1 - Math.exp(-dt * 5);

  // 낮/밤
  nightT += ((night ? 1 : 0) - nightT) * (1 - Math.exp(-dt * 2.5));
  hemi.intensity = THREE.MathUtils.lerp(1.25, .28, nightT);
  hemi.color.copy(C.hemiSkyD).lerp(C.hemiSkyN, nightT);
  hemi.groundColor.copy(C.hemiGndD).lerp(C.hemiGndN, nightT);
  sun.intensity = THREE.MathUtils.lerp(2.6, .35, nightT);
  sun.color.copy(C.sunD).lerp(C.sunN, nightT);
  for (const e of nightMats) e.m.emissiveIntensity = e.d + (e.n - e.d) * nightT;
  for (const g of lampGlows) g.opacity = nightT * .32;

  // 층 애니메이션
  floorObjs.forEach((o, i) => {
    o.lift += (o.liftT - o.lift) * k;
    o.g.position.y = i*FH + o.lift;
    const prev = o.op;
    o.op += (o.opT - o.op) * k;
    if (Math.abs(o.op - o.opT) < .002) o.op = o.opT;
    if (first || Math.abs(prev - o.op) > 1e-4){
      for (const m of o.mats){
        m.opacity = m.userData.base * o.op;
        m.depthWrite = m.userData.dw && o.op > .95;
      }
    }
    o.light.intensity = nightT * o.lightMax * o.op;
  });

  // 자동차
  for (const car of cars){
    car.pos += car.dir * car.speed * dt;
    const lim = car.axis === 'x' ? 34 : 28, off = car.axis === 'x' ? 0 : 2;
    if (car.pos > lim) car.pos = -lim; if (car.pos < -lim) car.pos = lim;
    if (car.axis === 'x'){ car.c.position.set(car.pos, 0, car.lane); car.c.rotation.y = car.dir > 0 ? 0 : PI; }
    else { car.c.position.set(car.lane, 0, car.pos + off); car.c.rotation.y = car.dir > 0 ? -PI/2 : PI/2; }
    const edge = Math.min(1, (lim - Math.abs(car.pos)) / 2.5);
    car.c.scale.setScalar(Math.max(.001, edge));
  }
  for (const w of walkers){
    const x = w.x + Math.sin(t * .25 * Math.sign(w.s) + w.ph) * 6;
    const vx = Math.cos(t * .25 * Math.sign(w.s) + w.ph) * Math.sign(w.s);
    w.p.position.set(x, Math.abs(Math.sin(t*6 + w.ph)) * .04, w.z);
    w.p.rotation.y = vx > 0 ? PI/2 : -PI/2;
  }

  // 회전 관성
  if (!drag){ azT += azVel; azVel *= Math.pow(.02, dt); if (Math.abs(azVel) < 1e-5) azVel = 0; }
  az += (azT - az) * (1 - Math.exp(-dt * 10));

  // 카메라
  const v = viewGoal();
  if (first) camTarget.copy(goalTarget);
  camTarget.lerp(goalTarget, k * .9);
  cur.vh += (v.h - cur.vh) * k * .9;
  cur.vw += (v.w - cur.vw) * k * .9;
  const ins = insets();
  const effW = Math.max(140, ins.Wd - ins.l - ins.r), effH = Math.max(140, ins.Hd - ins.t - ins.b);
  const wpp = Math.max(cur.vh / effH, cur.vw / effW) / zoomMul;
  const dxp = (ins.l - ins.r)/2, dyp = (ins.t - ins.b)/2;
  if (first){ cur.wpp = wpp; cur.dx = dxp; cur.dy = dyp; }
  cur.wpp += (wpp - cur.wpp) * k; cur.dx += (dxp - cur.dx) * k; cur.dy += (dyp - cur.dy) * k;

  const halfW = cur.wpp * ins.Wd / 2, halfH = cur.wpp * ins.Hd / 2;
  camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
  dir.set(Math.sin(az)*Math.cos(EL), Math.sin(EL), Math.cos(az)*Math.cos(EL));
  camera.position.copy(camTarget).addScaledVector(dir, R);
  camera.lookAt(camTarget);
  camera.updateMatrixWorld();
  tmpR.setFromMatrixColumn(camera.matrixWorld, 0);
  tmpU.setFromMatrixColumn(camera.matrixWorld, 1);
  camera.position.addScaledVector(tmpR, -cur.dx * cur.wpp).addScaledVector(tmpU, cur.dy * cur.wpp);
  camera.updateMatrixWorld();

  doHover();
  renderer.render(scene, camera);
  first = false;
  requestAnimationFrame(frame);
}

renderPanel();
window.__stillwellReady = true;
requestAnimationFrame(frame);
</script>
