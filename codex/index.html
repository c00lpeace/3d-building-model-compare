<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>STILLWELL — 공간 둘러보기</title>
<style>
  :root {
    color-scheme: light;
    --page: #f8f8f3;
    --paper: #fffefa;
    --ink: #202924;
    --muted: #56625a;
    --line: #d9ded3;
    --line-strong: #bcc6b9;
    --stage: #e8ede4;
    --grid: rgba(62, 90, 70, .08);
    --accent: #bcf487;
    --accent-ink: #1c301e;
    --chip: #eff3e9;
    --hint: rgba(255, 254, 250, .93);
    --focus: #346b38;
    font-family: Arial, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  :root[data-theme="night"] {
    color-scheme: dark;
    --page: #171d20;
    --paper: #222a2d;
    --ink: #f0f3ec;
    --muted: #b5c0b8;
    --line: #394548;
    --line-strong: #55635f;
    --stage: #1c282f;
    --grid: rgba(163, 191, 193, .085);
    --accent: #bcf487;
    --accent-ink: #1c301e;
    --chip: #303c39;
    --hint: rgba(34, 42, 45, .94);
    --focus: #bcf487;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .wrap { width: min(1440px, 100%); margin: 0 auto; padding: 0 clamp(16px, 4vw, 64px); }

  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 77px;
    border-bottom: 1px solid var(--line);
  }

  .brand { display: inline-flex; align-items: center; gap: 11px; }
  .brand-name { font-size: 20px; font-weight: 900; letter-spacing: -.055em; }
  .brand-mark {
    display: grid;
    place-content: center;
    gap: 3px;
    width: 31px;
    height: 31px;
    border-radius: 8px;
    background: var(--accent);
  }
  .brand-mark i {
    display: block;
    width: 13px;
    height: 2px;
    border-radius: 2px;
    background: var(--accent-ink);
    transform: skewY(-17deg);
  }

  .theme {
    display: inline-flex;
    gap: 3px;
    align-items: center;
    padding: 4px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--paper);
  }
  .theme button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    min-width: 53px;
    min-height: 32px;
    padding: 3px 10px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  .theme button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .theme-icon { font-size: 16px; line-height: 1; }

  .intro { padding: clamp(25px, 4vh, 44px) 0 24px; }
  .intro h1 { margin: 0 0 10px; font-size: clamp(30px, 4.5vw, 61px); line-height: 1.03; letter-spacing: -.085em; }
  .intro p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.65; word-break: keep-all; }

  .explorer {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(270px, 305px);
    min-height: 550px;
    border: 1px solid var(--line-strong);
    border-radius: 22px;
    overflow: hidden;
    background: var(--paper);
  }

  .stage {
    position: relative;
    display: grid;
    grid-template-columns: 70px minmax(0, 1fr);
    min-width: 0;
    min-height: clamp(550px, 69vh, 780px);
    isolation: isolate;
    background-color: var(--stage);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 31px 31px;
    background-position: center;
  }

  .floors {
    position: relative;
    z-index: 2;
    align-self: center;
    display: grid;
    gap: 5px;
    width: max-content;
    margin-left: 16px;
    padding: 5px;
    background: var(--hint);
    border: 1px solid var(--line-strong);
    border-radius: 13px;
  }

  .floors button {
    display: grid;
    place-items: center;
    width: 43px;
    min-height: 41px;
    padding: 0 3px;
    white-space: nowrap;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .floors button:hover { background: var(--chip); color: var(--ink); }
  .floors button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .floors button[data-floor="-1"] { font-size: 10px; }

  .viewport { position: relative; min-width: 0; min-height: 0; }
  .viewport canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: pan-y;
    cursor: grab;
  }
  .viewport canvas.dragging { cursor: grabbing; }

  .hint {
    position: absolute;
    right: 13px;
    bottom: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--hint);
    color: var(--muted);
    font-size: 11px;
    pointer-events: none;
  }
  .hint span { font-size: 17px; line-height: 1; }
  .scene-error {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 24px;
    text-align: center;
    align-content: center;
    color: var(--muted);
  }
  .scene-error[hidden] { display: none; }

  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 27px 24px 22px;
    border-left: 1px solid var(--line);
  }
  .panel-label {
    margin: 0 0 25px;
    padding-bottom: 17px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .11em;
    text-transform: uppercase;
  }
  .floor-code {
    display: inline-grid;
    place-items: center;
    min-width: 48px;
    min-height: 33px;
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--chip);
    font-size: 13px;
    font-weight: 800;
  }
  .panel h2 {
    margin: 15px 0 11px;
    font-size: clamp(25px, 2.7vw, 36px);
    line-height: 1.12;
    letter-spacing: -.07em;
    word-break: keep-all;
  }
  .description { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.75; word-break: keep-all; }
  .features { display: grid; gap: 9px; margin: 24px 0 30px; padding: 0; list-style: none; }
  .features li {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.35;
  }
  .features li::before { content: ""; width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: #79aa64; }
  .panel-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
  .panel-nav button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 5px 8px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: transparent;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }
  .panel-nav button:hover { background: var(--chip); }
  .panel-nav #next { border-color: transparent; background: var(--accent); color: var(--accent-ink); }
  .panel-nav #next:hover { filter: brightness(.95); }
  .panel-nav button:disabled { opacity: .4; cursor: default; }
  .footer { padding: 17px 0 22px; color: var(--muted); font-size: 11px; letter-spacing: .04em; }

  @media (max-width: 880px) {
    .explorer { grid-template-columns: minmax(0, 1fr) 245px; }
    .stage { grid-template-columns: 58px minmax(0, 1fr); min-height: 520px; }
    .floors { margin-left: 8px; }
    .floors button { width: 38px; }
    .panel { padding-inline: 18px; }
  }

  @media (max-width: 740px) {
    .masthead { min-height: 62px; }
    .explorer { grid-template-columns: minmax(0, 1fr); border-radius: 16px; }
    .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto clamp(320px, 59vh, 540px); min-height: 0; }
    .floors {
      align-self: auto;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 3px;
      width: auto;
      margin: 9px 9px 0;
      padding: 4px;
      border-radius: 10px;
    }
    .floors button { width: auto; min-width: 0; min-height: 40px; font-size: 12px; }
    .panel { border-left: 0; border-top: 1px solid var(--line); padding: 18px; }
    .panel-label { margin-bottom: 17px; padding-bottom: 13px; }
    .features { margin: 16px 0 20px; }
    .footer { padding-left: 2px; }
  }

  @media (max-width: 360px) {
    .wrap { padding-inline: 10px; }
    .floors { margin-inline: 5px; }
    .theme button { min-width: 46px; padding-inline: 7px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">STILLWELL</span>
    </div>
    <div class="theme" role="group" aria-label="시간대 선택">
      <button id="day" type="button" aria-pressed="true"><span class="theme-icon" aria-hidden="true">☀</span>낮</button>
      <button id="night" type="button" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☾</span>밤</button>
    </div>
  </header>

  <main>
    <div class="intro">
      <h1>공간 둘러보기</h1>
      <p>로비에서 루프테라스까지, 스틸웰의 층마다 다른 풍경을 만나보세요.</p>
    </div>

    <div class="explorer">
      <section class="stage" aria-label="스틸웰 3D 건물">
        <nav class="floors" aria-label="층 선택">
          <button type="button" data-floor="-1" aria-pressed="true">전체 보기</button>
          <button type="button" data-floor="0" aria-label="1층 로비" aria-pressed="false">1F</button>
          <button type="button" data-floor="1" aria-label="2층 사무 공간" aria-pressed="false">2F</button>
          <button type="button" data-floor="2" aria-label="3층 회의·라운지" aria-pressed="false">3F</button>
          <button type="button" data-floor="3" aria-label="4층 카페·테라스" aria-pressed="false">4F</button>
          <button type="button" data-floor="4" aria-label="5층 피트니스" aria-pressed="false">5F</button>
          <button type="button" data-floor="5" aria-label="루프테라스" aria-pressed="false">RF</button>
        </nav>
        <div class="viewport" id="viewport">
          <p class="scene-error" id="scene-error" role="status" hidden>3D 장면을 불러올 수 없습니다. 층별 정보는 층 선택 버튼으로 볼 수 있습니다.</p>
          <div class="hint" aria-hidden="true"><span>↔</span> 드래그하여 회전</div>
        </div>
      </section>

      <aside class="panel" aria-label="층별 정보">
        <p class="panel-label">층별 안내</p>
        <div aria-live="polite" aria-atomic="true">
          <span class="floor-code" id="floor-code">1F–RF</span>
          <h2 id="floor-title">스틸웰</h2>
          <p class="description" id="floor-description">일하고, 쉬고, 사람을 만나는 여섯 개의 공간입니다. 층 버튼이나 건물의 열린 단면을 눌러 안을 들여다보세요.</p>
          <ul class="features" id="features">
            <li>1층부터 5층까지 이어지는 실내 공간</li>
            <li>하늘 아래 펼쳐진 루프테라스</li>
          </ul>
        </div>
        <nav class="panel-nav" aria-label="이전 층과 다음 층">
          <button type="button" id="previous" disabled><span aria-hidden="true">←</span><span id="previous-text">이전 층</span></button>
          <button type="button" id="next"><span id="next-text">1F 보기</span><span aria-hidden="true">→</span></button>
        </nav>
      </aside>
    </div>
  </main>

  <footer class="footer">STILLWELL · 가상의 공간</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  "use strict";

  const overview = {
    code: "1F–RF",
    title: "스틸웰",
    description: "일하고, 쉬고, 사람을 만나는 여섯 개의 공간입니다. 층 버튼이나 건물의 열린 단면을 눌러 안을 들여다보세요.",
    features: ["1층부터 5층까지 이어지는 실내 공간", "하늘 아래 펼쳐진 루프테라스"]
  };

  const floorData = [
    {
      code: "1F", title: "로비",
      description: "유리문을 지나면 스틸웰 간판과 리셉션이 보입니다. 약속 시간보다 일찍 도착했다면 소파에서 잠시 쉬어가세요.",
      features: ["유리 출입구", "스틸웰 리셉션", "방문객 대기 공간"]
    },
    {
      code: "2F", title: "사무 공간",
      description: "서로 마주 보는 책상과 창가 자리가 있는 업무 공간입니다. 긴 테이블에서는 동료와 나란히 일할 수 있습니다.",
      features: ["공용 업무 테이블", "모니터가 있는 작업 좌석", "창가 조용한 자리"]
    },
    {
      code: "3F", title: "회의·라운지",
      description: "긴 테이블에서는 함께 의논하고, 옆 라운지에서는 소파에 앉아 이야기를 이어갑니다.",
      features: ["공용 회의 테이블", "발표용 보드", "소파와 낮은 테이블"]
    },
    {
      code: "4F", title: "카페·테라스",
      description: "카운터에서 커피를 받아 창가나 바깥 테라스로 나가보세요. 작은 원형 테이블이 실내와 야외를 잇습니다.",
      features: ["커피 바", "실내 카페 좌석", "야외 테라스"]
    },
    {
      code: "5F", title: "피트니스",
      description: "러닝머신과 웨이트 기구로 몸을 움직이는 공간입니다. 매트 위에서 가볍게 스트레칭할 수도 있습니다.",
      features: ["러닝머신", "덤벨 랙과 벤치", "스트레칭 매트"]
    },
    {
      code: "RF", title: "루프테라스",
      description: "건물 꼭대기에서 바람을 맞으며 쉬어갈 수 있습니다. 화분 사이의 소파와 퍼걸러 아래 좌석이 마련되어 있습니다.",
      features: ["퍼걸러 아래 야외 소파", "화분과 작은 정원", "하늘이 열린 휴식 공간"]
    }
  ];

  const floorButtons = Array.from(document.querySelectorAll("[data-floor]"));
  const floorCode = document.getElementById("floor-code");
  const floorTitle = document.getElementById("floor-title");
  const description = document.getElementById("floor-description");
  const features = document.getElementById("features");
  const previous = document.getElementById("previous");
  const next = document.getElementById("next");
  const previousText = document.getElementById("previous-text");
  const nextText = document.getElementById("next-text");
  const day = document.getElementById("day");
  const night = document.getElementById("night");
  const viewport = document.getElementById("viewport");
  let selected = -1;
  let isNight = false;
  let updateScene = () => {};

  function selectFloor(index) {
    selected = Math.max(-1, Math.min(floorData.length - 1, index));
    const details = floorData[selected] || overview;

    for (const button of floorButtons) {
      button.setAttribute("aria-pressed", String(Number(button.dataset.floor) === selected));
    }
    floorCode.textContent = details.code;
    floorTitle.textContent = details.title;
    description.textContent = details.description;
    features.replaceChildren(...details.features.map(feature => {
      const item = document.createElement("li");
      item.textContent = feature;
      return item;
    }));

    previous.disabled = selected === -1;
    previousText.textContent = selected > 0 ? `${floorData[selected - 1].code} 보기` : selected === 0 ? "전체 보기" : "이전 층";
    nextText.textContent = selected === floorData.length - 1 ? "전체 보기" : `${floorData[selected + 1].code} 보기`;
    updateScene();
  }

  function setTime(nightMode) {
    isNight = nightMode;
    document.documentElement.dataset.theme = nightMode ? "night" : "day";
    day.setAttribute("aria-pressed", String(!nightMode));
    night.setAttribute("aria-pressed", String(nightMode));
    updateScene();
  }

  for (const button of floorButtons) {
    button.addEventListener("click", () => selectFloor(Number(button.dataset.floor)));
  }
  previous.addEventListener("click", () => selectFloor(selected - 1));
  next.addEventListener("click", () => selectFloor(selected === floorData.length - 1 ? -1 : selected + 1));
  day.addEventListener("click", () => setTime(false));
  night.addEventListener("click", () => setTime(true));

  function initScene(THREE) {
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.setAttribute("aria-hidden", "true");
    viewport.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, .1, 100);
    const target = new THREE.Vector3(.2, 4.55, .95);
    camera.position.copy(target).add(new THREE.Vector3(19, 19, 19));
    camera.lookAt(target);

    const sky = new THREE.HemisphereLight(0xf4faff, 0x84907a, .83);
    const sun = new THREE.DirectionalLight(0xffecd3, 1.05);
    sun.position.set(8, 19, 11);
    sun.target.position.set(0, 4, 0);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1536, 1536);
    Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 41 });
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.normalBias = .035;
    sun.shadow.bias = -.00025;
    const fill = new THREE.DirectionalLight(0xc8dafe, .34);
    fill.position.set(-9, 7, -6);
    scene.add(sky, sun, sun.target, fill);

    const stage = new THREE.Group();
    const building = new THREE.Group();
    scene.add(stage, building);

    const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
    const tubeGeometry = new THREE.CylinderGeometry(1, 1, 1, 14);
    const ballGeometry = new THREE.SphereGeometry(1, 12, 8);
    const rockGeometry = new THREE.IcosahedronGeometry(1, 1);
    const planeGeometry = new THREE.PlaneGeometry(1, 1);
    const stageMaterials = new Map();

    function colorMaterial(group, color, kind) {
      const cache = group.userData.palette || stageMaterials;
      const key = `${color}/${kind}`;
      if (!cache.has(key)) {
        const glass = kind === "entry";
        const material = new THREE.MeshStandardMaterial({
          color,
          roughness: kind === "window" || glass ? .25 : .84,
          metalness: kind === "metal" ? .26 : 0,
          transparent: glass,
          opacity: glass ? .36 : 1,
          depthWrite: !glass
        });
        material.userData = { color: new THREE.Color(color), kind };
        cache.set(key, material);
      }
      return cache.get(key);
    }

    function primitive(group, geometry, x, y, z, sx, sy, sz, color, kind = "solid", rotate = 0) {
      const mesh = new THREE.Mesh(geometry, colorMaterial(group, color, kind));
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      mesh.rotation.y = rotate;
      mesh.castShadow = kind === "solid" || kind === "metal";
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }

    function box(group, x, y, z, width, height, depth, color, kind = "solid", rotate = 0) {
      return primitive(group, boxGeometry, x, y, z, width, height, depth, color, kind, rotate);
    }

    function tube(group, x, y, z, radius, height, color, kind = "solid") {
      return primitive(group, tubeGeometry, x, y, z, radius, height, radius, color, kind);
    }

    function orb(group, x, y, z, width, height, depth, color, faceted = false) {
      return primitive(group, faceted ? rockGeometry : ballGeometry, x, y, z, width, height, depth, color);
    }

          const wheel = tube(stage, x + dx, .13, z + side * .346, .13, .092, colors.black);
          wheel.rotation.x = Math.PI / 2;
          const hub = tube(stage, x + dx, .13, z + side * .397, .057, .018, 0xbfc7bf, "metal");
          hub.rotation.x = Math.PI / 2;
        }
      }
      for (const side of [-1, 1]) {
        box(stage, x + direction * .79, .247, z + side * .227, .028, .075, .135, 0xffe6a6, "headlight");
        box(stage, x - direction * .79, .238, z + side * .227, .028, .063, .108, 0xb9544d, "taillight");
      }
    }

    car(-4.04, 3.69, 0xba6250, 1);
    car(.10, 4.69, 0xc8ad69, -1);
    car(5.53, 4.68, 0x75999b, -1);

    for (const x of [-5.16, 4.7]) {
      tube(stage, x, .78, 2.97, .037, 1.56, colors.frame, "metal");
      box(stage, x, 1.52, 3.15, .072, .063, .42, colors.frame, "metal");
      box(stage, x, 1.483, 3.34, .105, .039, .19, 0xffdc8e, "headlight");
    }

    const dayFade = new THREE.Color(0xaebcae);
    const nightFade = new THREE.Color(0x344350);
    const daySign = new THREE.Color(0xffffff);
    const nightSign = new THREE.Color(0xb3bfc2);
    const warmWindow = new THREE.Color(0xffcf85);
    let frameId = 0;
    let yawTarget = 0;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function scheduleFrame() {
      if (!frameId) frameId = requestAnimationFrame(render);
    }

    function paint(material, dim) {
      const { color, kind } = material.userData;
      material.color.copy(color);
      material.emissive.setHex(0x000000);
      material.emissiveIntensity = 1;

      if (isNight && kind === "window") {
        material.color.copy(warmWindow);
        material.emissive.setHex(0xf6a949);
        material.emissiveIntensity = .78 * (1 - dim);
      } else if (isNight && (kind === "headlight" || kind === "taillight")) {
        material.emissive.copy(color);
        material.emissiveIntensity = .8;
      } else if (isNight && kind === "entry") {
        material.emissive.setHex(0x48707c);
        material.emissiveIntensity = .36 * (1 - dim);
      }

      material.color.lerp(isNight ? nightFade : dayFade, dim);
      if (kind === "entry") material.opacity = .36 - dim * .17;
    }

    updateScene = () => {
      sky.color.setHex(isNight ? 0x8aa4d7 : 0xf4faff);
      sky.groundColor.setHex(isNight ? 0x43526c : 0x84907a);
      sky.intensity = isNight ? .54 : .83;
      sun.color.setHex(isNight ? 0x93addb : 0xffecd3);
      sun.intensity = isNight ? .37 : 1.05;
      fill.intensity = isNight ? .23 : .34;
      for (const material of stageMaterials.values()) paint(material, 0);

      for (const group of floors) {
        const active = group.userData.floor === selected;
        const dim = selected >= 0 && !active ? .7 : 0;
        for (const material of group.userData.palette.values()) paint(material, dim);
        for (const sign of group.userData.signs) {
          sign.color.copy(isNight ? nightSign : daySign).lerp(isNight ? nightFade : dayFade, dim);
        }
      }
      scheduleFrame();
    };

    function render() {
      frameId = 0;
      const easing = reducedMotion.matches ? 1 : .16;
      let moving = false;

      function approach(value, goal) {
        if (Math.abs(value - goal) < .001) return goal;
        const nextValue = value + (goal - value) * easing;
        if (nextValue !== goal) moving = true;
        return nextValue;
      }

      building.rotation.y = approach(building.rotation.y, yawTarget);
      for (const group of floors) {
        const { floor, baseY } = group.userData;
        const active = floor === selected;
        const separation = selected < 0 ? 0 : active ? .27 : Math.sign(floor - selected) * .20;
        group.position.x = approach(group.position.x, active ? .84 : 0);
        group.position.y = approach(group.position.y, baseY + separation);
        group.position.z = approach(group.position.z, active ? 1.18 : 0);
      }

      renderer.render(scene, camera);
      if (moving) scheduleFrame();
    }

    function resize() {
      const width = Math.max(viewport.clientWidth, 1);
      const height = Math.max(viewport.clientHeight, 1);
      const aspect = width / height;
      const verticalSpan = Math.max(15.45, 16.05 / aspect);
      camera.left = -verticalSpan * aspect / 2;
      camera.right = verticalSpan * aspect / 2;
      camera.top = verticalSpan / 2;
      camera.bottom = -verticalSpan / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      scheduleFrame();
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const canvas = renderer.domElement;
    let gesture = null;

    function pickFloor(event) {
      const bounds = canvas.getBoundingClientRect();
      pointer.set(
        (event.clientX - bounds.left) / bounds.width * 2 - 1,
        1 - (event.clientY - bounds.top) / bounds.height * 2
      );
      raycaster.setFromCamera(pointer, camera);
      const [hit] = raycaster.intersectObjects(floors, true);
      if (hit) selectFloor(hit.object.parent.userData.floor);
    }

    function clearGesture() {
      gesture = null;
      canvas.classList.remove("dragging");
    }

    canvas.addEventListener("pointerdown", event => {
      if (!event.isPrimary || event.button !== 0) return;
      gesture = { id: event.pointerId, x: event.clientX, y: event.clientY, yaw: yawTarget, dragged: false };
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", event => {
      if (!gesture || event.pointerId !== gesture.id) return;
      const dx = event.clientX - gesture.x;
      const dy = event.clientY - gesture.y;
      if (!gesture.dragged && Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) {
        gesture.dragged = true;
        canvas.classList.add("dragging");
      }
      if (gesture.dragged) {
        yawTarget = THREE.MathUtils.clamp(gesture.yaw + dx * .006, -.72, .72);
        scheduleFrame();
      }
    });

    canvas.addEventListener("pointerup", event => {
      if (!gesture || event.pointerId !== gesture.id) return;
      const distance = Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y);
      if (!gesture.dragged && distance < 7) pickFloor(event);
      clearGesture();
    });
    canvas.addEventListener("pointercancel", clearGesture);
    canvas.addEventListener("lostpointercapture", clearGesture);

    if ("ResizeObserver" in window) {
      new ResizeObserver(resize).observe(viewport);
    } else {
      window.addEventListener("resize", resize);
    }
    resize();
    updateScene();
  }

  try {
    if (!window.THREE) throw new Error("Three.js could not be loaded.");
    initScene(window.THREE);
  } catch (error) {
    const canvas = viewport.querySelector("canvas");
    if (canvas) canvas.remove();
    const hint = viewport.querySelector(".hint");
    hint.hidden = true;
    document.getElementById("scene-error").hidden = false;
    updateScene = () => {};
  }
})();
</script>
</body>
</html>
