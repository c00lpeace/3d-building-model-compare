<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STILLWELL — 층별로 둘러보는 공간</title>
<meta name="description" content="STILLWELL, 건물 한 동을 층별로 둘러보는 공간 소개 페이지">
<style>
  :root{
    --ink:#1c2226; --muted:#5b646b; --card:rgba(255,255,255,.86); --card-solid:#fff;
    --line:rgba(20,30,40,.10); --chip:rgba(20,30,40,.05); --accent:#2f6b5d; --accent-ink:#fff;
    --shadow:0 10px 40px rgba(30,40,50,.14), 0 2px 8px rgba(30,40,50,.06);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Helvetica Neue", Arial, sans-serif;
  }
  body.night{
    --ink:#eef1f5; --muted:#a3acb8; --card:rgba(17,21,33,.82); --card-solid:#151a28;
    --line:rgba(255,255,255,.12); --chip:rgba(255,255,255,.07); --accent:#f0b25a; --accent-ink:#1a1408;
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9ede9}
  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;color:inherit}
  #app{position:fixed;inset:0;overflow:hidden}

  /* sky */
  .sky{position:absolute;inset:0;pointer-events:none}
  .sky.day{background:linear-gradient(180deg,#bcd8e6 0%,#dde9e8 45%,#f1ece2 100%)}
  .sky.night{opacity:0;background:linear-gradient(180deg,#070c1c 0%,#121a33 50%,#262b42 100%)}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}

  /* stage */
  #stage{position:absolute;inset:0}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
  #c.dragging{cursor:grabbing}
  #c.hovering{cursor:pointer}
  #hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12.5px;color:var(--muted);
    background:var(--card);padding:7px 14px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap;
    transition:opacity .6s;pointer-events:none}
  #hint.hide{opacity:0}
  #tip{position:absolute;pointer-events:none;font-size:12.5px;font-weight:600;background:var(--card-solid);color:var(--ink);
    padding:6px 10px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transform:translate(14px,-120%);transition:opacity .15s;white-space:nowrap}
  #tip.on{opacity:1}
  #tip span{font-weight:500;color:var(--muted);margin-left:6px}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;color:var(--muted);padding:24px}

  /* header */
  #top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:22px 26px;pointer-events:none;z-index:3}
  #top > *{pointer-events:auto}
  .logo{font-weight:800;font-size:22px;letter-spacing:.34em;line-height:1}
  .tag{font-size:13px;color:var(--muted);margin-top:8px}
  #dn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);
    border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:13.5px;font-weight:600;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  #dn .knob{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ffcf5a;color:#6b4a00;transition:background .4s,color .4s}
  body.night #dn .knob{background:#3c4870;color:#ffe9b0}
  #dn svg{width:18px;height:18px}
  #dn .moon{display:none} body.night #dn .moon{display:block} body.night #dn .sun{display:none}

  /* ui overlay */
  #ui{position:absolute;inset:0;pointer-events:none;z-index:2}
  #panel{position:absolute;left:24px;bottom:24px;width:350px;max-height:calc(100% - 130px);overflow:auto;pointer-events:auto;
    background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:20px;padding:22px 22px 18px;box-shadow:var(--shadow)}
  .p-head{display:flex;align-items:center;gap:10px}
  .code{display:inline-grid;place-items:center;min-width:40px;height:26px;padding:0 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;letter-spacing:.04em}
  .en{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  #p-name{margin:12px 0 8px;font-size:23px;font-weight:750;letter-spacing:-.01em}
  #p-desc{margin:0 0 14px;font-size:14.5px;line-height:1.62;color:var(--muted)}
  #p-feat{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:7px}
  #p-feat li{display:flex;align-items:center;gap:10px;font-size:14px;background:var(--chip);border-radius:10px;padding:9px 12px}
  #p-feat li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .p-label{font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
  .p-nav{display:flex;gap:8px}
  .pn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:transparent;
    border-radius:12px;padding:9px 12px;cursor:pointer;font-size:13.5px;font-weight:650;transition:background .2s,border-color .2s}
  .pn small{font-size:11px;font-weight:600;color:var(--muted)}
  .pn:hover{background:var(--chip);border-color:var(--accent)}
  .pn.next{align-items:flex-end;text-align:right}
  .pn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;align-items:center;text-align:center}
  .pn.primary small{color:inherit;opacity:.8}
  .pn[hidden]{display:none}
  #p-all{margin-top:10px;width:100%;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:8px;border-radius:10px;cursor:pointer}
  #p-all:hover{background:var(--chip);color:var(--ink)}
  #p-all[hidden]{display:none}
  .fade-in{animation:fi .38s ease}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  #floors{position:absolute;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:6px;pointer-events:auto}
  .fbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:12px;padding:8px 14px 8px 8px;cursor:pointer;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:background .2s,transform .2s,border-color .2s;min-width:150px}
  .fbtn b{display:inline-grid;place-items:center;width:34px;height:28px;border-radius:8px;background:var(--chip);font-size:13px;font-weight:800}
  .fbtn .nm{font-weight:600;color:var(--muted)}
  .fbtn:hover{transform:translateX(-3px);border-color:var(--accent)}
  .fbtn[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
  .fbtn[aria-pressed="true"] b{background:rgba(255,255,255,.2)}
  .fbtn[aria-pressed="true"] .nm{color:inherit}
  .fbtn.all{margin-top:8px;justify-content:center;padding:10px 14px;font-weight:700}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  @media (max-height:600px) and (min-width:761px){
    #panel{padding:16px;width:320px;max-height:calc(100% - 96px)}
    #p-desc{font-size:13.5px;margin-bottom:10px}
    #p-feat li{padding:6px 10px;font-size:13px}
    .fbtn{min-width:0;padding:5px 8px} .fbtn .nm{display:none} .fbtn b{height:24px}
    #top{padding:14px 18px}
  }

  /* mobile: stacked layout — stage / panel / floor buttons never overlap */
  @media (max-width:760px){
    #app{display:flex;flex-direction:column}
    #top{position:relative;padding:14px 14px 4px;align-items:center}
    .logo{font-size:18px}
    .tag{font-size:12px;margin-top:6px}
    #dn{padding:4px 12px 4px 4px;font-size:13px}
    #dn .knob{width:28px;height:28px}
    #stage{position:relative;inset:auto;flex:1 1 auto;min-height:0}
    #hint{bottom:auto;top:6px;font-size:11.5px;padding:5px 11px}
    #ui{position:relative;inset:auto;display:flex;flex-direction:column;gap:8px;padding:0 10px calc(10px + env(safe-area-inset-bottom));flex:none}
    #panel{position:relative;left:auto;bottom:auto;width:auto;max-height:36vh;padding:14px 15px 12px;border-radius:16px}
    #p-name{font-size:19px;margin:8px 0 6px}
    #p-desc{font-size:13.5px;line-height:1.55;margin-bottom:10px}
    #p-feat{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    #p-feat li{font-size:12.5px;padding:6px 10px;border-radius:999px}
    #p-feat li::before{width:6px;height:6px}
    .pn{padding:8px 10px;font-size:13px}
    #p-all{margin-top:6px;padding:6px}
    #floors{position:relative;right:auto;top:auto;transform:none;flex-direction:row;gap:5px}
    .fbtn{flex:1;min-width:0;justify-content:center;padding:6px 0;border-radius:10px;gap:0}
    .fbtn b{background:transparent;width:auto;height:30px}
    .fbtn .nm{display:none}
    .fbtn:hover{transform:none}
    .fbtn.all{margin-top:0;flex:1.5;font-size:12.5px;padding:6px 4px}
  }
</style>

<body>
<div id="app">
  <div class="sky day"></div>
  <div class="sky night" id="skyNight"></div>

  <header id="top">
    <div class="brand">
      <div class="logo">STILLWELL</div>
      <div class="tag">층별로 둘러보는 공간 소개</div>
    </div>
    <button id="dn" type="button" aria-pressed="false" aria-label="낮/밤 전환">
      <span class="knob">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.6A8.3 8.3 0 0 1 9.4 4a8.3 8.3 0 1 0 10.6 10.6z"/></svg>
      </span>
      <span id="dnLabel">낮</span>
    </button>
  </header>

  <main id="stage">
    <canvas id="c" tabindex="0" aria-label="STILLWELL 건물 3D 뷰. 드래그해서 회전, 층을 클릭해서 선택"></canvas>
    <div id="tip"></div>
    <div id="hint">드래그해서 회전 · 층을 클릭해서 보기</div>
    <div id="msg">3D 장면을 불러오는 중…</div>
  </main>

  <div id="ui">
    <section id="panel" aria-live="polite">
      <div id="p-body">
        <div class="p-head"><span class="code" id="p-code">ALL</span><span class="en" id="p-en">Overview</span></div>
        <h2 id="p-name">STILLWELL</h2>
        <p id="p-desc"></p>
        <ul id="p-feat"></ul>

      <div class="p-label" id="p-label">다른 층 보기</div>
      <div class="p-nav">
        <button type="button" class="pn prev" id="p-prev"></button>
        <button type="button" class="pn next" id="p-next"></button>
      </div>
      <button type="button" id="p-all">전체 보기</button>
    </section>
    <nav id="floors" aria-label="층 선택"></nav>
  </div>
</div>

<script>
  // 낮/밤 하늘의 별 (CSS)
  (function(){
    const sky=document.getElementById('skyNight');
    let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
    for(let i=0;i<90;i++){const d=document.createElement('i');d.className='star';
      d.style.left=(r()*100)+'%';d.style.top=(r()*62)+'%';d.style.opacity=(0.25+r()*0.75).toFixed(2);
      const z=r()<0.15?3:2;d.style.width=d.style.height=z+'px';sky.appendChild(d);}
  })();
  (function(){
    const fail=()=>{const m=document.getElementById('msg');if(m&&m.isConnected&&m.dataset.ok!=='1'){m.textContent='3D 장면을 불러오지 못했습니다. 인터넷 연결(Three.js CDN)을 확인한 뒤 새로고침해 주세요.';}};
    window.addEventListener('error',fail);
    setTimeout(fail,15000);
  })();
</script>

<script type="module">

   데이터

  { code:'5F', en:'Fitness', name:'피트니스',

    feats:['퍼걸러 아웃도어 소파 라운지','계절 식재 플랜터 정원','밤을 밝히는 스트링 라이트'] },
];
const OVERVIEW = { code:'ALL', en:'Overview', name:'STILLWELL',
  desc:'다섯 개 층과 루프테라스로 이루어진 작은 복합 공간입니다. 층 버튼을 누르거나 건물의 층을 직접 클릭해 내부를 둘러보세요.',
  feats:['지상 5층 + 루프테라스','로비 · 오피스 · 라운지 · 카페 · 피트니스','드래그로 회전 · 낮/밤 전환'] };

/* ------------------------------------------------------------------
   기본 상수 / 유틸
------------------------------------------------------------------ */
const H = 3.4, FY = 0.3;               // 층고, 바닥 마감 높이
const X0 = -8, X1 = 8, Z0 = -5.5, Z1 = 5.5, SETBACK = 3;
const WALL = 0xf0ebe3, FRAME = 0x2e3438, CONC = 0xd4cfc7, CORE = 0xc7b49e;
const WOOD = 0xb88a5f, DWOOD = 0x7a5638, GREEN = 0x2f6b5d, TERRA = 0xd2774c;

let seed = 20261126;
const rng = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rng() * a.length)];
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const SHIRTS = [0x2f6b5d, 0xd2774c, 0x3b5a85, 0xe8e1d4, 0x8c4a5a, 0xc9a13b, 0x56606a, 0x6f8f6a, 0xf1f1ee];
const PANTS = [0x2b2f36, 0x3a4658, 0x5b4c3e, 0x24262b, 0x7b766c];
const SKINS = [0xf1c8a6, 0xdcab86, 0xb27c58, 0xf6d9c1, 0x8d5c3e];
const HAIRS = [0x2a211c, 0x4a3426, 0x151515, 0x8a6a45, 0x6b6b6b];

/* ------------------------------------------------------------------
   렌더러 / 씬 / 카메라
------------------------------------------------------------------ */
const canvas = document.getElementById('c');
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('msg').textContent = '이 브라우저에서는 WebGL을 사용할 수 없어 3D 장면을 표시할 수 없습니다.';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 400);

const hemi = new THREE.HemisphereLight(0xdcebff, 0xb8a78f, 1.2);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xfff2dc, 2.6);
sun.position.set(20, 34, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 110 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ------------------------------------------------------------------
   지오메트리 / 머티리얼 헬퍼
------------------------------------------------------------------ */
const GEO = {
  box: new THREE.BoxGeometry(1, 1, 1),
  plane: new THREE.PlaneGeometry(1, 1),
  sph: new THREE.SphereGeometry(1, 18, 12),
  ico: new THREE.IcosahedronGeometry(1, 1),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 20),
  cone: new THREE.ConeGeometry(1, 1, 10),
  torso: new THREE.CapsuleGeometry(0.19, 0.36, 4, 12),
  arm: new THREE.CapsuleGeometry(0.055, 0.42, 3, 8),
  circle: new THREE.CircleGeometry(1, 32),
};

function makeCtx(index) {
  const group = new THREE.Group();
  if (index !== undefined) group.userData.floor = index;
  return { index, group, mats: [], cache: new Map(), nightMats: [], lights: [] };
}
// 재질 팩토리: 층마다 별도 재질 → 층 단위로 흐리게 처리 가능
function M(ctx, color, o = {}) {
  const key = color + '|' + JSON.stringify(o);
  if (ctx.cache.has(key)) return ctx.cache.get(key);
  const m = new THREE.MeshStandardMaterial({
    color, roughness: o.r ?? 0.8, metalness: o.m ?? 0,
    transparent: !!o.t, opacity: o.op ?? 1, depthWrite: !o.t,
    side: o.side ?? THREE.FrontSide, flatShading: !!o.flat,
  });
  if (o.e !== undefined) {
    m.emissive = new THREE.Color(o.e);
    m.userData.eDay = o.ed ?? 0; m.userData.eNight = o.en ?? 1;
    m.emissiveIntensity = m.userData.eDay;
    ctx.nightMats.push(m);
  }

const ISO_EL = Math.atan(1 / Math.SQRT2);  // 35.26° 등각
const view = { az: Math.PI / 4, vel: 0, userZoom: 1, viewH: 32, aspect: 1, w: 1, h: 1, mobile: false };
const camCur = { x: 0, y: 9.2, z: 0, zoom: 1 };
const camTgt = { x: 0, y: 9.2, z: 0, zoom: 1 };
let selected = -1, hovered = -1;

function layout() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  view.w = w; view.h = h; view.aspect = w / h;
  view.mobile = window.innerWidth <= 760;
  renderer.setSize(w, h, false);
  view.viewH = Math.max(32, 25 / view.aspect);
  const hh = view.viewH / 2, hw = hh * view.aspect;
  camera.left = -hw; camera.right = hw; camera.top = hh; camera.bottom = -hh;
  // 데스크톱에서는 왼쪽 패널·오른쪽 버튼을 피해 장면을 살짝 오른쪽으로
  if (!view.mobile) {
    const panelW = document.getElementById('panel').offsetWidth + 24;
    const navW = document.getElementById('floors').offsetWidth + 22;
    view.shift = clamp((panelW - navW) / 2, 0, w * 0.18);
    view.availW = w - panelW - navW - 20;
  } else { view.shift = 0; view.availW = w; }
  camera.setViewOffset(w, h, -view.shift, 0, w, h);
  camera.updateProjectionMatrix();
  updateTargets();
}

function selectedZoom() {
  const pxPerUnit = view.h / view.viewH;
  const f = floors[selected];
  const width = f ? (f.bounds.x1 - f.bounds.x0) * 0.707 + (Z1 - Z0) * 0.707 + 3 : 22;
  return clamp(view.availW / (width * pxPerUnit), 1.0, 2.0);
}

function updateTargets() {
  floors.forEach((f, i) => {
    if (selected < 0) Object.assign(f.tgt, { lift: 0, slide: 0, op: 1, line: i === hovered ? 0.85 : 0 });
    else if (i === selected) Object.assign(f.tgt, { lift: 0.7, slide: 1.8, op: 1, line: 0.9 });
    else if (i > selected) Object.assign(f.tgt, { lift: 7.5, slide: 0, op: 0.12, line: i === hovered ? 0.6 : 0 });
    else Object.assign(f.tgt, { lift: 0, slide: 0, op: 0.3, line: i === hovered ? 0.6 : 0 });
  });
  if (selected < 0) Object.assign(camTgt, { x: 0, y: 9.2, z: 0, zoom: 1 });
  else {
    const f = floors[selected];
    Object.assign(camTgt, { x: f.bounds.cx, y: building.position.y + f.baseY + 0.7 + 1.5, z: 1.8 * 0.6, zoom: selectedZoom() });
  }
}

function mkBtn(idx, label, name, cls) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'fbtn ' + (cls || '');
  b.innerHTML = idx < 0 ? label : `<b>${label}</b><span class="nm">${name}</span>`;
  b.setAttribute('aria-pressed', 'false');
  b.setAttribute('aria-label', idx < 0 ? '전체 보기' : `${label} ${name}`);
  b.addEventListener('click', () => select(idx));
  if (idx >= 0) {
    b.addEventListener('mouseenter', () => { hovered = idx; updateTargets(); });
    b.addEventListener('mouseleave', () => { hovered = -1; updateTargets(); });
  }
  nav.appendChild(b); btns.push({ idx, el: b });
}

function select(i) {
  i = clamp(i, -1, FLOORS.length - 1);
  if (i === selected) return;
  selected = i; hovered = -1;
  renderPanel(); updateTargets(); hideTip();
}

// 낮/밤
let nightTgt = 0, night = 0, nightApplied = -1;
const dn = $('dn');
function setNight(on) {
  nightTgt = on ? 1 : 0;
  document.body.classList.toggle('night', on);
  dn.setAttribute('aria-pressed', String(on));
  $('dnLabel').textContent = on ? '밤' : '낮';
}
dn.addEventListener('click', () => setNight(nightTgt < 0.5));

// 키보드
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'Escape') select(-1);
  else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); select(selected < 0 ? 0 : Math.min(selected + 1, FLOORS.length - 1)); }
  else if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); if (selected >= 0) select(selected - 1); }
  else if (e.key === 'ArrowLeft') view.az += 0.12;
  else if (e.key === 'ArrowRight') view.az -= 0.12;
});

/* ------------------------------------------------------------------
   포인터: 드래그 회전, 클릭 선택, 호버, 휠/핀치 줌
------------------------------------------------------------------ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tip = $('tip'), hint = $('hint');
function pickFloor(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(building, true);
  let first = -1;
  for (const h of hits) {
    let o = h.object; while (o && o.userData.floor === undefined) o = o.parent;
    if (!o) continue;
    const idx = o.userData.floor;
    if (first < 0) first = idx;
    if (floors[idx].cur.op > 0.5) return idx;
  }
  return first;
}
function showTip(idx, x, y) {
  const r = stage.getBoundingClientRect();
  tip.innerHTML = `${FLOORS[idx].code} ${FLOORS[idx].name}<span>${idx === selected ? '선택됨' : '클릭해서 보기'}</span>`;
  tip.style.left = (x - r.left) + 'px'; tip.style.top = (y - r.top) + 'px';
  tip.classList.add('on');
}
function hideTip() { tip.classList.remove('on'); }

const pointers = new Map();
let drag = null, pinch = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    drag = { x: e.clientX, y: e.clientY, lastX: e.clientX, lastT: performance.now(), moved: 0 };
    view.vel = 0;
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: view.userZoom };
    if (drag) drag.moved = 99;
  }
});
canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    view.userZoom = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, pinch.d), 0.6, 2.4);
    return;
  }
  if (drag && pointers.has(e.pointerId)) {
    const dx = e.clientX - drag.lastX, now = performance.now();
    drag.moved += Math.abs(dx) + Math.abs(e.movementY || 0);
    if (Math.abs(e.clientX - drag.x) > 4) canvas.classList.add('dragging');
    const k = 0.0085;
    view.az -= dx * k;
    const dt = Math.max(1, now - drag.lastT);
    view.vel = (-dx * k) / dt * 16.7;
    drag.lastX = e.clientX; drag.lastT = now;
    if (drag.moved > 6) { hint.classList.add('hide'); hideTip(); }
    return;
  }
  if (e.pointerType === 'mouse') pendingHover = { x: e.clientX, y: e.clientY };
});
let pendingHover = null;
function processHover() {
  if (!pendingHover) return;
  const { x, y } = pendingHover; pendingHover = null;
  const idx = pickFloor(x, y);
  if (idx !== hovered) { hovered = idx; updateTargets(); }
  canvas.classList.toggle('hovering', idx >= 0);
  if (idx >= 0) showTip(idx, x, y); else hideTip();
}
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pinch) { if (pointers.size < 2) pinch = null; if (pointers.size === 0) drag = null; return; }
  if (drag) {
    if (performance.now() - drag.lastT > 90) view.vel = 0;
    if (drag.moved < 6 && e.type === 'pointerup') {
      const idx = pickFloor(e.clientX, e.clientY);
      if (idx >= 0) select(idx === selected ? -1 : idx);
    }
    drag = null; canvas.classList.remove('dragging');
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !drag) { pendingHover = null; if (hovered !== -1) { hovered = -1; updateTargets(); } hideTip(); canvas.classList.remove('hovering'); } });
canvas.addEventListener('wheel', e => { e.preventDefault(); view.userZoom = clamp(view.userZoom * Math.exp(-e.deltaY * 0.0012), 0.6, 2.4); }, { passive: false });
canvas.addEventListener('dblclick', () => { view.userZoom = 1; });

/* ------------------------------------------------------------------
   적용 함수 (투명도 / 낮밤)
------------------------------------------------------------------ */
function applyOpacity(f, op) {
  const faded = op < 0.995;
  for (const m of f.mats) {
    const want = m.userData.baseT || faded;
    if (m.transparent !== want) { m.transparent = want; m.needsUpdate = true; }
    m.opacity = m.userData.baseOp * op;
    const dw = m.userData.baseT ? false : op > 0.5;
    if (m.depthWrite !== dw) m.depthWrite = dw;
  }
  const cast = op > 0.6;
  if (f.castOn !== cast) {
    f.castOn = cast;
    f.group.traverse(o => { if (o.isMesh && o.userData.cast) o.castShadow = cast; });
  }
  f.appliedOp = op;
}
const C = (h) => new THREE.Color(h);
const SUN_DAY = C(0xfff2dc), SUN_NIGHT = C(0x8ea4ff);
const HS_DAY = C(0xdcebff), HS_NIGHT = C(0x2c3a66), HG_DAY = C(0xb8a78f), HG_NIGHT = C(0x1a1b24);
function applyNight(t) {
  sun.intensity = 2.6 + (0.35 - 2.6) * t;
  sun.color.copy(SUN_DAY).lerp(SUN_NIGHT, t);
  hemi.intensity = 1.2 + (0.42 - 1.2) * t;
  hemi.color.copy(HS_DAY).lerp(HS_NIGHT, t);
  hemi.groundColor.copy(HG_DAY).lerp(HG_NIGHT, t);
  amb.intensity = 0.35 + (0.1 - 0.35) * t;
  for (const ctx of [...floors, env]) for (const m of ctx.nightMats) m.emissiveIntensity = m.userData.eDay + (m.userData.eNight - m.userData.eDay) * t;
  for (const g of glowMats) g.opacity = 0.55 * t;
  $('skyNight').style.opacity = t;
  nightApplied = t;
}

/* ------------------------------------------------------------------
   루프
------------------------------------------------------------------ */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  processHover();
  // 회전 관성
  if (!drag) { view.az += view.vel * dt * 60; view.vel *= Math.pow(0.9, dt * 60); if (Math.abs(view.vel) < 1e-4) view.vel = 0; }

  // 카메라
  camCur.x = damp(camCur.x, camTgt.x, 4, dt); camCur.y = damp(camCur.y, camTgt.y, 4, dt); camCur.z = damp(camCur.z, camTgt.z, 4, dt);
  camCur.zoom = damp(camCur.zoom, camTgt.zoom, 4, dt);
  const R = 80;
  tmp.set(camCur.x + R * Math.cos(ISO_EL) * Math.sin(view.az), camCur.y + R * Math.sin(ISO_EL), camCur.z + R * Math.cos(ISO_EL) * Math.cos(view.az));
  camera.position.copy(tmp);
  camera.lookAt(camCur.x, camCur.y, camCur.z);
  const z = camCur.zoom * view.userZoom;
  if (Math.abs(camera.zoom - z) > 1e-5) { camera.zoom = z; camera.updateProjectionMatrix(); }

  // 층 애니메이션
  for (const f of floors) {
    f.cur.lift = damp(f.cur.lift, f.tgt.lift, 5, dt);
    f.cur.slide = damp(f.cur.slide, f.tgt.slide, 5, dt);
    f.cur.op = damp(f.cur.op, f.tgt.op, 6, dt);
    f.cur.line = damp(f.cur.line, f.tgt.line, 10, dt);
    if (Math.abs(f.tgt.op - f.cur.op) < 0.002) f.cur.op = f.tgt.op;
    f.group.position.y = f.baseY + f.cur.lift;
    f.group.position.z = f.cur.slide;
    if (Math.abs(f.cur.op - f.appliedOp) > 0.002 || (f.cur.op === f.tgt.op && f.appliedOp !== f.cur.op)) applyOpacity(f, f.cur.op);
    f.outline.material.opacity = f.cur.line;
    f.outline.visible = f.cur.line > 0.01;
    f.outline.material.color.set(night > 0.5 ? 0xf0b25a : 0x2f6b5d);
    for (const L of f.lights) L.intensity = (L.userData.day + (L.userData.night - L.userData.day) * night) * f.cur.op;
  }

  // 낮/밤
  night = damp(night, nightTgt, 3, dt);
  if (Math.abs(night - nightTgt) < 0.002) night = nightTgt;
  if (night !== nightApplied) applyNight(night);

  // 자동차
  for (const c of cars) {
    c.pos += c.lane.dir * c.speed * dt;
    if (c.pos > 24) c.pos = -24; if (c.pos < -24) c.pos = 24;
    const s = clamp((23.2 - Math.abs(c.pos)) / 1.2, 0, 1);
    if (c.lane.axis === 'x') c.obj.position.set(c.pos, 0.04, c.lane.c); else c.obj.position.set(c.lane.c, 0.04, c.pos);
    c.obj.scale.setScalar(Math.max(0.001, s));
    c.obj.visible = s > 0.01;
  }
  // 러닝머신 위 사람
  const runners = floors[4].runners || [];
  for (const r of runners) r.obj.position.y = 0.21 + Math.abs(Math.sin(t * 7 + r.phase)) * 0.06;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------
   시작
------------------------------------------------------------------ */
new ResizeObserver(layout).observe(stage);
window.addEventListener('resize', layout);
renderPanel();
layout();
applyNight(0);
const msg = $('msg'); msg.dataset.ok = '1'; msg.remove();
setTimeout(() => hint.classList.add('hide'), 9000);
requestAnimationFrame(frame);
</script>
</body>
</html>
